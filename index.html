<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Queue</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            color: black;
            background-color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .machine {
            border: 1px solid black;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            border: 1px solid black;
            background-color: white;
            color: black;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            border-radius: 0;
            text-transform: uppercase;
        }
        button:hover {
            background-color: black;
            color: white;
        }
        /* Paywall Modal */
        #paywall {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 100;
        }
        .paywall-content {
            border: 2px solid black;
            background-color: white;
            width: 400px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        .plan {
            border: 1px solid black;
            padding: 15px;
            margin: 15px 0;
        }
        .cancel-btn {
            border: none;
            text-decoration: underline;
            margin-top: 15px;
        }
        .cancel-btn:hover {
            background-color: transparent;
            color: black;
        }
        /* Meme Overlay */
        #meme-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            z-index: 200;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 3s ease-out;
        }
        #meme-overlay img {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Laundry Queue</h1>
        <p>Claim a machine:</p>

        <div class="machine">
            <span>Washing Machine 1</span>
            <button onclick="showPaywall()">Claim</button>
        </div>
        <div class="machine">
            <span>Washing Machine 2</span>
            <button onclick="showPaywall()">Claim</button>
        </div>
        
        <div class="machine">
            <span>Dryer 1</span>
            <button onclick="showPaywall()">Claim</button>
        </div>
        <div class="machine">
            <span>Dryer 2</span>
            <button onclick="showPaywall()">Claim</button>
        </div>
        <div class="machine">
            <span>Dryer 3</span>
            <button onclick="showPaywall()">Claim</button>
        </div>
    </div>

    <div id="paywall">
        <div class="paywall-content">
            <h2>Premium Access Required</h2>
            <p>To use the laundry queue, you must subscribe.</p>
            
            <div class="plan">
                <h3>Monthly Plan</h3>
                <p>$199 / month</p>
            </div>
            
            <div class="plan">
                <h3>Annual Plan</h3>
                <p>$150 / month (billed annually)</p>
            </div>

            <button onclick="doNothing()">Subscribe & Claim</button>
            <br>
            <button class="cancel-btn" onclick="hidePaywall()">Cancel</button>
        </div>
    </div>

    <div id="meme-overlay">
        <img src="https://img.huffingtonpost.com/asset/618c7c452100002f826fef95.jpeg?ops=scalefit_500_noupscale" alt="Meme">
    </div>

    <script>
        function showPaywall() {
            document.getElementById('paywall').style.display = 'block';
        }

        function hidePaywall() {
            document.getElementById('paywall').style.display = 'none';
        }

        function doNothing() {
            const overlay = document.getElementById('meme-overlay');
            // Show the image at full opacity
            overlay.style.display = 'flex';
            
            // Force a reflow so the transition works
            void overlay.offsetWidth;
            
            // Trigger the fade out
            overlay.style.opacity = '0';

            // Hide the overlay completely after the 3-second transition
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.style.opacity = '1'; // Reset for next time
            }, 3000);
        }
    </script>
</body>
</html>
